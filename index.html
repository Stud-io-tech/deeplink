<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Capricha AÍ</title>

  <script>
    function openApp() {
      const fullPath =
        window.location.pathname + window.location.search;

      const fallback = encodeURIComponent(
        window.location.href
      );

      const intent =
        "intent://caprichaai" +
        "#Intent;" +
        "scheme=https;" +
        "package=br.com.caprichaai.app;" +
        "S.route=" + encodeURIComponent(fullPath) + ";" +
        "S.browser_fallback_url=" + fallback + ";" +
        "end;";

      window.location.href = intent;
    }
  </script>
</head>

<body onload="openApp()">
  <p>Redirecionando para o Capricha AÍ...</p>
</body>
</html>
