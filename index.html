<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Capricha AÍ</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #ffffff;
      font-family: sans-serif;
      flex-direction: column;
    }

    .loader {
      border: 8px solid #ffffff;
      border-top: 8px solid #FE0019;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    p {
      color: #333;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="loader"></div>
  <script>
    setTimeout(function () {
      window.location.href = "https://drive.google.com/file/d/1n8R4y1s2VwAYvEgARG9XASkhl2Uq6bLN/view?usp=drive_link";
    }, 2500);
  </script>
</body>

</html>
