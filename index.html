<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Capricha AÍ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script>
    function openApp() {
      const path = window.location.pathname;

      const route = path === "/" ? "home" : path.substring(1);

      const intent =
        "intent://" + route +
        "#Intent;" +
        "scheme=https;" +
        "package=br.com.caprichaai.app;" +
        "end;";

      window.location.href = intent;

      setTimeout(() => {
        window.location.href = "https://homolazarus.netlify.app/";
      }, 1500);
    }
  </script>
</head>

<body onload="openApp()">
  <p>Redirecionando para o Capricha AÍ...</p>
</body>
</html>
