<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Capricha AÍ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script>
    function openApp() {
      const path = window.location.pathname;
      const route = path === "/" ? "home" : path.substring(1);

      const fallback = encodeURIComponent(
        "https://homolazarus.netlify.app/"
      );

      const intent =
        "intent://" + route +
        "#Intent;" +
        "scheme=https;" +
        "package=br.com.caprichaai.app;" +
        "S.browser_fallback_url=" + fallback + ";" +
        "end;";

      window.location.href = intent;
    }
  </script>
</head>

<body onload="openApp()">
  <p>Redirecionando para o Capricha AÍ...</p>
</body>
</html>
